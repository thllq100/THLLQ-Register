<style>
:root{
  /* Helles Thema – Standard, weil Berater in hellen Programmen arbeiten und drucken */
  --ground:#fbfbfc;--ground-2:#f3f4f7;--rule:#e3e5ea;--rule-2:#c9cdd6;
  --ink:#13161c;--ink-2:#454c5a;--ink-3:#5e6674;
  --cool:#2a5cb0;--warm:#9a5f18;--up:#15704a;--down:#a33227;--neu:#535a68;
  --c-grid:#e6e8ec;--c-axis:#8d94a2;--c-panel:rgba(255,255,255,.78);--c-panelrand:rgba(19,22,28,.12);
  --schatten:0 10px 34px rgba(19,22,28,.12);
  --sans:"Schibsted Grotesk","Inter","Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"Martian Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#07080b;--ground-2:#0d1016;--rule:#1b1f27;--rule-2:#2b3140;
    --ink:#eef0f5;--ink-2:#a2a9b8;--ink-3:#79818f;
    --cool:#93b4f0;--warm:#e0a96d;--up:#5cb68d;--down:#d4695f;--neu:#8a92a1;
    --c-grid:#1b1f27;--c-axis:#79818f;--c-panel:rgba(20,24,32,.72);--c-panelrand:rgba(238,240,245,.14);
    --schatten:0 12px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --ground:#07080b;--ground-2:#0d1016;--rule:#1b1f27;--rule-2:#2b3140;
  --ink:#eef0f5;--ink-2:#a2a9b8;--ink-3:#79818f;
  --cool:#93b4f0;--warm:#e0a96d;--up:#5cb68d;--down:#d4695f;--neu:#8a92a1;
  --c-grid:#1b1f27;--c-axis:#79818f;--c-panel:rgba(20,24,32,.72);--c-panelrand:rgba(238,240,245,.14);
  --schatten:0 12px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.62;font-weight:350;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input{font:inherit}
:focus-visible{outline:1px solid var(--cool);outline-offset:3px}
.lbl{font-family:var(--mono);font-size:10.5px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
.up{color:var(--up)}.down{color:var(--down)}.cool{color:var(--cool)}.warm{color:var(--warm)}.neu{color:var(--neu)}

.top{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:13px 28px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:color-mix(in srgb, var(--ground) 93%, transparent);backdrop-filter:blur(10px);z-index:20}
.brand{display:flex;align-items:baseline;gap:12px;cursor:pointer;flex:none}
.brand b{font-family:var(--mono);font-weight:400;font-size:14px;letter-spacing:.32em}
.brand span{font-size:11px;color:var(--ink-3)}
.nav{display:flex;flex:1;justify-content:center}
.nav button{font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);padding:5px 13px 14px;border-bottom:1px solid transparent;margin-bottom:-14px}
.nav button:hover{color:var(--ink-2)}
.nav button[aria-current=true]{color:var(--ink);border-bottom-color:var(--cool)}
.top-r{display:flex;align-items:center;gap:12px;flex:none}
.srch{display:flex;align-items:center;gap:9px;border:1px solid var(--rule-2);padding:5px 8px 5px 11px;color:var(--ink-3);font-size:12.5px}
.srch:hover{border-color:#333949;color:var(--ink-2)}
kbd{font-family:var(--mono);font-size:9px;border:1px solid var(--rule-2);padding:2px 5px;color:var(--ink-3)}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--rule-2);padding:2px 7px}
.cta{border:1px solid var(--cool);color:var(--cool);padding:6px 13px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.cta:hover{background:color-mix(in srgb, var(--cool) 12%, transparent)}
.thm{border:1px solid var(--rule-2);color:var(--ink-3);padding:6px 11px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.thm:hover{color:var(--ink-2);border-color:var(--ink-3)}
.drk{border:1px solid var(--rule-2);color:var(--ink-2);padding:7px 14px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.drk:hover{border-color:var(--cool);color:var(--cool)}

.trust{display:flex;align-items:center;flex-wrap:wrap;padding:9px 28px;border-bottom:1px solid var(--rule);background:var(--ground-2);font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.trust b{font-weight:400;color:var(--ink-2)}
.trust span{padding-right:16px;margin-right:16px;border-right:1px solid var(--rule-2)}
.trust span:last-of-type{border-right:none}
.trust button{color:var(--cool);font-size:11.5px;font-family:var(--mono)}
.trust button:hover{text-decoration:underline}

.wrap{max-width:1080px;margin:0 auto;padding:28px 28px 40px}
h1{font-size:27px;font-weight:300;letter-spacing:-.02em;line-height:1.26;margin:0 0 10px;max-width:28ch;text-wrap:balance}
h1 em{font-style:normal;color:var(--ink-3)}
h2{font-size:17px;font-weight:400;margin:0 0 8px}
.lede{color:var(--ink-2);margin:0;max-width:68ch;font-size:14.5px}
.sec{margin-top:34px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:18px;border-bottom:1px solid var(--rule);padding-bottom:8px;margin-bottom:18px}
.sechead p{margin:0;font-size:12.5px;color:var(--ink-3)}

.instr{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--rule);margin-bottom:24px}
.instr button{display:flex;flex-direction:column;gap:3px;padding:10px 20px 11px 0;margin-right:20px;border-bottom:2px solid transparent;margin-bottom:-1px;text-align:left}
.instr button b{font-weight:400;font-size:13px;color:var(--ink-3)}
.instr button i{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.instr button:hover b{color:var(--ink-2)}
.instr button[aria-current=true] b{color:var(--ink)}
.instr button[aria-current=true]{border-bottom-color:var(--cool)}

.head2{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin-bottom:6px}
.head2 .px{font-family:var(--mono);font-size:36px;font-weight:300;letter-spacing:-.06em}
.head2 .ch{font-family:var(--mono);font-size:13.5px}
.head2 .rg{font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}

.scn{display:grid;grid-template-columns:repeat(3,1fr)}
.sc{padding:15px 18px 17px;border-left:2px solid;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);border-right:1px solid var(--rule)}
.sc .pr{font-family:var(--mono);font-size:28px;font-weight:300;letter-spacing:-.06em;line-height:1}
.sc h3{margin:7px 0 5px;font-size:14.5px;font-weight:400}
.sc p{margin:0 0 12px;font-size:13px;color:var(--ink-3);line-height:1.5}
.sc dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-family:var(--mono);font-size:11.5px}
.sc dt{color:var(--ink-3)}
.sc dd{margin:0;text-align:right;letter-spacing:-.03em}

svg{display:block;width:100%;height:auto;overflow:visible}
.cw{position:relative}
.tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;background:var(--ground-2);border:1px solid var(--rule-2);padding:7px 10px;font-family:var(--mono);font-size:11px;white-space:nowrap;transform:translate(-50%,-128%);z-index:4}
.tip i{font-style:normal;color:var(--ink-3);font-size:10px}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--ink-2);margin-top:13px}
.legend i{display:inline-block;width:14px;height:0;border-top:1.5px solid;vertical-align:middle;margin-right:6px}
.legend s{display:inline-block;width:9px;height:9px;text-decoration:none;vertical-align:middle;margin-right:6px}

details.ein{border-bottom:1px solid var(--rule)}
details.ein>summary{list-style:none;cursor:pointer}
details.ein>summary::-webkit-details-marker{display:none}
details.ein>summary .inp{border-bottom:0}
details.ein>summary:hover .inp{background:var(--ground-2)}
details.ein[open]>summary .inp{background:var(--ground-2)}
details.ein>summary .v::after{content:" ▸";color:var(--ink-3);font-size:11px}
details.ein[open]>summary .v::after{content:" ▾"}
.detail{padding:4px 0 18px 14px;margin:0 0 4px 14px;border-left:2px solid var(--rule-2);max-width:78ch}
.detail dl{margin:0}
.detail dt{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:12px}
.detail dd{margin:3px 0 0;font-size:13px;line-height:1.55;color:var(--ink-2)}
.detail a{color:var(--cool)}
.inp{display:grid;grid-template-columns:186px 104px 1fr 84px;gap:14px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--rule)}
.inp .n{font-size:13.5px}
.inp .v{font-family:var(--mono);font-size:13.5px;letter-spacing:-.03em}
.inp .t{font-size:13px;color:var(--ink-2);line-height:1.55}
.inp .w{font-family:var(--mono);font-size:11px;text-align:right}

/* Herleitung */
.calc{display:grid;grid-template-columns:1fr 84px;gap:0 14px;max-width:540px;font-family:var(--mono);font-size:13px}
.calc div{padding:6px 0;border-bottom:1px solid var(--rule)}
.calc .r{text-align:right;letter-spacing:-.03em}
.calc .base,.calc .sum{color:var(--ink)}
.calc .sum{border-bottom:none;border-top:1px solid var(--rule-2);font-size:15px;padding-top:9px}
.calc .lb{color:var(--ink-2);font-family:var(--sans);font-size:13px;font-weight:300}

table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;font-weight:350}
th{text-align:right;font-weight:500;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:0 0 9px 12px;border-bottom:1px solid var(--rule);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
td{padding:7px 0 7px 12px;border-bottom:1px solid var(--rule);text-align:right;letter-spacing:-.03em;white-space:nowrap}
tr:hover td{background:color-mix(in srgb, var(--cool) 6%, transparent)}
.tblwrap{overflow-x:auto}
td .nm{font-family:var(--sans);font-size:13.5px;letter-spacing:0;font-weight:300}
td.wrap2{white-space:normal;text-align:left;color:var(--ink-2)}

.figs{display:flex;flex-wrap:wrap;row-gap:18px}
.fig{padding-right:26px;margin-right:26px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:3px}
.fig:last-child{border-right:none;margin-right:0;padding-right:0}
.fig .v{font-family:var(--mono);font-size:23px;font-weight:300;letter-spacing:-.05em}
.fig .d{font-family:var(--mono);font-size:11.5px}

.note{border-left:1px solid var(--rule-2);padding:2px 0 2px 18px;font-size:13.5px;color:var(--ink-2);max-width:68ch;margin-top:24px}
.note b{color:var(--ink);font-weight:400}
.warnbox{border:1px solid var(--warm);border-left-width:2px;padding:14px 18px;max-width:70ch;margin-top:20px;background:color-mix(in srgb, var(--warm) 8%, transparent)}
.warnbox .lbl{color:var(--warm)}
.warnbox p{margin:6px 0 0;font-size:13px;color:var(--ink-2)}
.foot{margin-top:44px;padding-top:14px;border-top:1px solid var(--rule);font-family:var(--mono);font-size:10.5px;color:var(--ink-3);line-height:1.8}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{border:1px solid var(--rule-2);padding:6px 12px;font-size:12.5px;color:var(--ink-2)}
.chip:hover{border-color:var(--cool);color:var(--ink)}
.pill{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--rule-2)}

/* Marktfeld */
.feldwrap{position:relative;margin-top:20px;height:min(44vh,340px);min-height:290px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
#feld{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
.axis-l,.axis-r,.axis-t,.axis-b{position:absolute;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);pointer-events:none}
.axis-l{left:2px;bottom:8px}.axis-r{right:2px;bottom:8px}.axis-t{left:2px;top:8px}.axis-b{left:2px;bottom:26px}
.glass{position:absolute;width:252px;padding:14px 16px 15px;pointer-events:none;z-index:5;
  background:var(--c-panel);backdrop-filter:blur(14px) saturate(120%);-webkit-backdrop-filter:blur(14px) saturate(120%);
  border:1px solid var(--c-panelrand);box-shadow:var(--schatten)}
.glass .gh b{font-weight:400;font-size:14px;display:block}
.glass dl{margin:10px 0 0;display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-family:var(--mono);font-size:11.5px}
.glass dt{color:var(--ink-3)}
.glass dd{margin:0;text-align:right;letter-spacing:-.03em}
.glass .gs{margin-top:11px;padding-top:10px;border-top:1px solid var(--c-panelrand);font-family:var(--mono);font-size:10.5px;color:var(--cool)}

/* Brief */
.brief{max-width:640px;margin:0 auto;border:1px solid var(--rule);background:var(--ground-2)}
.brief .bh{padding:17px 24px;border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:11.5px;color:var(--ink-3);display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.brief .bh b{font-weight:400;color:var(--ink)}
.brief .bb{padding:26px 24px 30px}
.brief .bb p{margin:0 0 15px;font-size:14.5px;line-height:1.65;color:var(--ink-2)}
.brief .bb p.first{color:var(--ink)}
.brief h3{font-size:11px;font-family:var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin:26px 0 12px;font-weight:400}
.brief .row{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:9px 0;border-bottom:1px solid var(--rule)}
.brief .row b{font-weight:400;font-size:13.5px}
.brief .row i{font-style:normal;font-size:12.5px;color:var(--ink-2);grid-column:1/-1;line-height:1.55}
.brief .row .p{font-family:var(--mono);font-size:14px;letter-spacing:-.04em}
.brief .sig{margin-top:26px;padding-top:16px;border-top:1px solid var(--rule);font-size:13px;color:var(--ink-3);line-height:1.65}

/* Anmeldung / Preise */
.signup{border:1px solid var(--rule-2);padding:22px 24px 24px;margin-top:30px;max-width:640px}
.signup .f{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.signup input{flex:1;min-width:200px;background:var(--ground-2);border:1px solid var(--rule-2);color:var(--ink);padding:9px 12px;font-size:13.5px}
.signup input:focus{outline:none;border-color:var(--cool)}
.signup button{border:1px solid var(--cool);color:var(--cool);padding:9px 18px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.signup button:hover{background:color-mix(in srgb, var(--cool) 12%, transparent)}
.signup .msg{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-top:10px;min-height:14px}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:20px}
.tier{border:1px solid var(--rule);border-right:none;padding:18px 18px 20px}
.tier:last-child{border-right:1px solid var(--rule)}
.tier .pr{font-family:var(--mono);font-size:22px;letter-spacing:-.05em;margin:6px 0 10px}
.tier ul{margin:0;padding:0;list-style:none;font-size:12.5px;color:var(--ink-3);line-height:1.7}
.tier.hi{border-color:var(--rule-2);background:color-mix(in srgb, var(--cool) 5%, transparent)}

.sitefoot{border-top:1px solid var(--rule);margin-top:60px;padding:24px 28px 44px;font-family:var(--mono);font-size:11px;color:var(--ink-3);display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.sitefoot button:hover{color:var(--ink-2)}
.sitefoot a{color:inherit;text-decoration:none}
.sitefoot a:hover{color:var(--ink-2)}
.sec a,.note a{color:var(--cool);text-decoration:underline;text-underline-offset:3px}

#pal{position:fixed;inset:0;z-index:40;display:none;padding:13vh 20px 20px;justify-content:center;background:color-mix(in srgb, var(--ground) 78%, transparent)}
#pal.on{display:flex}
.palbox{width:min(540px,100%);max-height:60vh;background:var(--ground-2);border:1px solid var(--rule-2);display:flex;flex-direction:column;overflow:hidden}
.palbox input{width:100%;background:none;border:none;border-bottom:1px solid var(--rule);color:var(--ink);font-size:16px;font-weight:300;padding:15px 18px}
.palbox input:focus{outline:none}
.palbox ul{list-style:none;margin:0;padding:6px;overflow-y:auto}
.palbox li{display:flex;justify-content:space-between;gap:16px;padding:9px 12px;cursor:pointer}
.palbox li[aria-selected=true]{background:color-mix(in srgb, var(--cool) 12%, transparent)}
.palbox li b{font-weight:400;font-size:13.5px}
.palbox li span{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

/* Kopfzeile: bricht um, bevor sie breiter wird als das Fenster.
   Ohne das entsteht beim Hineinzoomen ein waagerechter Rollbalken fuer die
   ganze Seite, und der Inhalt sitzt dann verschoben im Fenster. */
@media (max-width:1220px){
  .top{flex-wrap:wrap;gap:10px 18px}
  .nav{order:3;flex:0 0 100%;width:100%;justify-content:flex-start;
       overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{white-space:nowrap;padding-bottom:11px;margin-bottom:-11px}
  .nav button:first-child{padding-left:0}
}
@media (max-width:940px){
  .top{flex-wrap:wrap;gap:10px;padding:11px 16px}
  .nav{order:3;flex:0 0 100%;width:100%;justify-content:flex-start;
       overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{white-space:nowrap;padding-bottom:11px;margin-bottom:-11px}
  .brand span,.tag,kbd{display:none}
  .srch{padding:5px 9px}
  .wrap{padding:20px 16px 30px}
  .scn{grid-template-columns:1fr}
  .tiers{grid-template-columns:1fr}
  .tier{border-right:1px solid var(--rule);border-bottom:none}
  .tier:last-child{border-bottom:1px solid var(--rule)}
  .inp{grid-template-columns:1fr 88px;gap:5px 12px}
  .inp .t{grid-column:span 2}.inp .w{display:none}
  .trust{padding:8px 16px;font-size:10px}
  .sitefoot{padding:20px 16px 36px}
}
@media (max-width:470px){
  /* Inline-Rasterangaben an den Zeilen ueberstimmen die Regel oben.
     Auf schmalen Geraeten wird deshalb erzwungen gestapelt. */

<script>
"use strict";
const $=s=>document.querySelector(s);
const CSSV=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const FARB=()=>({grid:CSSV("--c-grid"),axis:CSSV("--c-axis"),ink:CSSV("--ink"),ink2:CSSV("--ink-2"),

const nf=(n,d=2)=>n.toLocaleString("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d});
const sg=(n,d=2,u=" %")=>(n>0?"+":n<0?"−":"±")+nf(Math.abs(n),d)+u;
const dstr=d=>d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"});

/* ====================================================================
   DER STAND. Diese Zahlen sind echt und beginnen bei null.
   Wenn eine Aussage veröffentlicht wird, kommt sie in AUSSAGEN – mit
   Zeitstempel, Auflösungsregel und Quelle. Nichts wird vorbefüllt.
   ==================================================================== */
/* Beginn der Reihe: das Datum der ersten veröffentlichten Aussage. Wird aus
   dem Register gelesen, damit hier kein Datum von Hand gepflegt werden muss.
   Solange keine Aussage existiert, gilt das geplante Startdatum. */
const START = (()=>{
  const r = (typeof window!=="undefined" && window.THLLQ_REGISTER) || null;
  const a = r && r.aussagen && r.aussagen.length
    ? r.aussagen.map(x=>x.aufgestellt).sort()[0] : null;
  return a ? new Date(a.slice(0,10)) : new Date("2026-09-15");
})();
/* register.js wird von bauen.py aus dem Git-Register erzeugt. Fehlt die Datei,
   bleibt die Seite im Tag-0-Zustand – sie bricht nicht, sie zeigt eine Null. */
const REG = (typeof window!=="undefined" && window.THLLQ_REGISTER) || null;
const AUSSAGEN = REG ? REG.aussagen : [];
const STAND = (REG && REG.stand) || {n:0,aufgeloest:0,offen:0};
const KLASSEN = (REG && REG.klassen) || [];
const QUARTALE = (REG && REG.quartale) || [];
const ARTSTAND = (REG && REG.arten) || [];
const AUFG = AUSSAGEN.filter(a=>a.o!==null&&a.o!==undefined);
const OFFEN = AUSSAGEN.filter(a=>a.o===null||a.o===undefined);
const HATDATEN = AUFG.length>0;
const TAEGL = (STAND && STAND.taeglich) || null;
const z1=n=>nf(n,1), z3=n=>nf(n,3);
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const GHUB="https://github.com/thllq100/THLLQ-Register/blob/main/";
const detail=a=>`<div class="detail"><dl>
  <dt>Auflösungsregel</dt><dd>${esc(a.regel)||"—"}</dd>
  <dt>Grundrate</dt><dd>${a.grundrate!=null?nf(a.grundrate*100,0)+" %":"—"}${a.konsens?" · "+esc(a.konsens):""}</dd>
  <dt>Quelle</dt><dd>${esc(a.quelle)||"—"}</dd>
  ${a.begruendung?`<dt>Begründung, vor dem Ereignis geschrieben</dt><dd>${esc(a.begruendung)}</dd>`:""}
  ${a.beleg?`<dt>Beleg</dt><dd>${esc(a.beleg)}</dd>`:""}
  ${a.anmerkung?`<dt>Anmerkung</dt><dd>${esc(a.anmerkung)}</dd>`:""}
  <dt>Originaldatei</dt><dd><a href="${GHUB}aussagen/${encodeURIComponent(a.id)}.json" target="_blank" rel="noopener noreferrer">aussagen/${esc(a.id)}.json</a>${a.o!=null?` · <a href="${GHUB}aufloesungen/${encodeURIComponent(a.id)}.json" target="_blank" rel="noopener noreferrer">Auflösung</a>`:""}</dd>
</dl></div>`;
const pl=(n,e,m)=>n===1?`${n} ${e}`:`${n} ${m}`;   /* 1 Aussage, 2 Aussagen */

function tageSeit(){const t=Math.floor((Date.now()-START)/86400000);return t<0?0:t;}

/* Ein einziges Beispiel – überall sichtbar als Beispiel gekennzeichnet. */

 ["Die Auflösungsregel steht vor dem Ereignis fest.",

/* Name · Markt · Fälle im Jahr · Anmerkung.  "—" heißt: kein Markt, sondern

/* Ergebnisse der Rückrechnung vom 11.09.2026 – echte Zahlen. */
const RUECK = [

   <div class="sec"><div class="sechead"><span class="lbl">Kalibrierungskurve</span><p>Angekündigt gegen eingetreten${KLASSEN.length?" · Balken sind 95-%-Intervalle":" · noch ohne Datenpunkte"}</p></div>

     ${[0,20,40,60,80,100].map(v=>`<text x="${X(v).toFixed(1)}" y="${H-22}" text-anchor="middle" fill="${f.ink3}" font-size="11" font-family="Martian Mono, ui-monospace, monospace">${v} %</text>`).join("")}

          +`<path d="${pt.map((p,i)=>`${i?"L":"M"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join("")}" fill="none" stroke="${f.cool}" stroke-width="2"/>`

     <text x="${L}" y="${H-4}" fill="${f.ink3}" font-size="10.5" font-family="Martian Mono, ui-monospace, monospace">angekündigte Wahrscheinlichkeit</text>

   ${KLASSEN.length?`<div class="sec"><div class="sechead"><span class="lbl">Nach Klasse</span><p>Mit 95-%-Intervall – bei wenigen Fällen ist es breit, und das soll man sehen</p></div>

   ${ARTSTAND.length?`<div class="sec"><div class="sechead"><span class="lbl">Nach Aussagenart</span><p>Mit Grundrate – so sieht man, was leicht war</p></div>
    <div class="tblwrap"><table><thead><tr><th>Art</th><th>Aufgelöst</th><th>Grundrate</th><th>Ø angekündigt</th><th>Tatsächlich</th><th>Schwierigkeit</th></tr></thead><tbody>

   ${OFFEN.length?`<div class="sec"><div class="sechead"><span class="lbl">Offene Aussagen</span><p>Nach Stichtag</p></div>

    <div class="tblwrap"><table><thead><tr><th>Stichtag</th><th>Aussage</th><th>W'keit</th><th>Ergebnis</th></tr></thead><tbody>

   <div class="sec"><div class="sechead"><span class="lbl">Was wann aussagekräftig wird</span><p>Damit niemand zu früh etwas hineinliest – ich selbst eingeschlossen</p></div>
    <div class="tblwrap"><table><thead><tr><th>Ab … aufgelösten Aussagen</th><th>Was sich dann sagen lässt</th><th>voraussichtlich</th></tr></thead><tbody>
      <tr><td><span class="nm">50</span></td><td>Erster Zwischenstand. Richtung erkennbar, statistisch noch nicht belastbar.</td><td>~ Monat 3</td></tr>
      <tr><td><span class="nm">200</span></td><td>Kalibrierung je Wahrscheinlichkeitsklasse mit brauchbarem Vertrauensintervall.</td><td>~ Monat 8</td></tr>

    </tbody></table></div></div>

   <div class="note"><b>Warum die Schwierigkeit mitgemessen wird:</b> Eine Eintrittsquote allein
    lässt sich schönrechnen – man muss nur leichte Aussagen treffen. Die Schwierigkeit misst,

   <div class="sec"><div class="sechead"><span class="lbl">Die vier Regeln</span><p>Unverändert seit dem ersten Tag</p></div>

`;}};

V["brief"]={r:()=>`
  <h1>Der Freitagsbrief</h1>

   dem 2. Oktober 2026: einmal die Woche, kostenlos, mit den Aussagen der kommenden Tage,
   dem Ausgang der vorherigen und dem Stand der Tafel. Bis dahin steht hier nur, wie er

  <div class="sec">
    <div class="note" style="margin-bottom:14px"><b>Musteransicht.</b> Der folgende Text
     wurde nie verschickt. Er zeigt die geplante Form, damit man sie beurteilen kann, bevor

    <div class="brief">
    <div class="bh"><span>Von</span><b>THLLQ</b><span>Betreff</span><b>Muster · so soll eine Ausgabe aussehen</b>
      <span>Datum</span><b>— noch nicht erschienen —</b></div>
    <div class="bb">
      <p class="first">So würde die erste Ausgabe anfangen. Sie enthält keine Bilanz, weil es

       Wochen, jede mit einer Wahrscheinlichkeit und einer Auflösungsregel, die vorher feststeht.
       In drei Monaten stehen an dieser Stelle die ersten Auswertungen.</p>
      <p>Bevor das losgeht, eine Sache, die mir wichtiger ist als ein guter Start: Ich habe
       vorher geprüft, ob sich mit dem naheliegenden Ansatz – der Wochenrichtung großer
       Aktienindizes – überhaupt etwas gewinnen lässt. Das Ergebnis war ein klares Nein, und
       es steht vollständig auf der Methodenseite, samt Skript zum Nachrechnen. Ich fange

      <h3>Die Aussagen für die kommenden zwei Wochen</h3>
      <div class="row"><b>Beispiel</b><span class="p cool">62 %</span>
        <i>„${BEISPIEL.frage}" – Stichtag ${BEISPIEL.stich}. ${BEISPIEL.begruendung}</i></div>

        Eintrittsquote — · erster Zwischenstand ab 50 aufgelösten</p>
      <div class="sig">Bis Freitag,<br>THLLQ<br><br>
        Diese Nachricht enthält Einschätzungen, keine Anlageempfehlungen und keine Anlageberatung.<br>

    </div></div></div>

  <div class="sec"><div class="sechead"><span class="lbl">Noch keine Anmeldung</span><p>Absichtlich</p></div>
    <p class="lede" style="max-width:70ch">Es gibt hier bewusst kein Anmeldefeld. Ein Brief,

     Versand steht, wäre ein Versprechen ohne Deckung. Sobald der Brief tatsächlich läuft,

    <p class="lede" style="max-width:70ch">Der Brief ist kostenlos, und es gibt vorerst nichts

     Wann sich das ändert, steht in der Tabelle unter
     <button data-go="#/kalibrierung" style="color:var(--cool)">Kalibrierung</button>.</p></div>
  <div class="foot">Der Brief erscheint noch nicht. Geplanter Beginn: Freitag, 2. Oktober 2026.</div>`};

V["methode"]={r:()=>`
  <h1>Was ich geprüft habe, <em>bevor ich angefangen habe.</em></h1>
  <p class="lede">Der naheliegende Zuschnitt für so ein Vorhaben wäre die Wochenrichtung großer
   Aktienindizes gewesen. Ich habe ihn zuerst gerechnet, statt ihn zu verkaufen. Er trägt nicht,
   und hier stehen die Zahlen dazu.</p>

  <div class="sec"><div class="sechead"><span class="lbl">Die Frage</span><p>Klar genug, um eine Antwort zuzulassen</p></div>
    <p class="lede" style="max-width:70ch">Schlägt ein Modell aus sieben kursabgeleiteten Größen
     die simple Grundrate – also die Häufigkeit, mit der Aktien ohnehin steigen? Gerechnet wurde
     ausschließlich vorwärtsrollend: Für jede Testwoche wurde nur mit Daten trainiert, die vor
     dieser Woche lagen, Standardisierung und Saisonalität eingeschlossen.</p></div>

  <div class="sec"><div class="sechead"><span class="lbl">Ergebnis</span><p>Drei Märkte, rund 5.800 getestete Wochen</p></div>
    <div class="tblwrap"><table><thead><tr><th>Markt</th><th>Zeitraum</th><th>Getestete Wochen</th><th>AUC</th><th>Vorsprung</th></tr></thead><tbody>
      ${RUECK.map(r=>`<tr><td><span class="nm">${r[0]}</span></td><td>${r[1]}</td><td>${r[2]}</td>
        <td>${r[3]}</td><td class="down">${r[4]}</td></tr>`).join("")}
    </tbody></table></div>
    <p style="font-size:12.5px;color:var(--ink-3);margin-top:12px;max-width:70ch">
      Die AUC misst allein die Rangordnung: Bekommen steigende Wochen höhere Werte als fallende?
      0,50 heißt: kein Wissen. Alle drei Werte liegen dort. Und selbst wenn man das Modell im
      Nachhinein optimal zur Grundrate hin schrumpft – mit einer Zahl, die man vorher nicht
      kennen kann –, bleiben +0,02 % übrig.</p></div>

  <div class="sec"><div class="sechead"><span class="lbl">Zweiter Anlauf</span><p>Mit der Positionierung aus den CFTC-Berichten</p></div>
    <div class="tblwrap"><table><thead><tr><th>Prüfung</th><th>Getestete Wochen</th><th>AUC</th><th>Vorsprung</th></tr></thead><tbody>
      ${RUECK_COT.map(r=>`<tr><td><span class="nm">${r[0]}</span></td><td>${r[1]}</td>
        <td>${r[2]}</td><td class="down">${r[3]}</td></tr>`).join("")}
    </tbody></table></div>
    <p style="font-size:12.5px;color:var(--ink-3);margin-top:12px;max-width:70ch">
      Commitments of Traders, Legacy-Bericht, E-Mini S&amp;P 500 und E-Mini Nasdaq 100, zurück
      bis 1997 beziehungsweise 1999. Stichtag ist Dienstag, veröffentlicht wird Freitag –
      gerechnet wurde mit einer Woche Sicherheitsabstand, damit jeder verwendete Bericht am
      Stichtag seit mindestens sieben Tagen öffentlich war.</p></div>

  <div class="note"><b>Ein Detail spricht für die Messung selbst.</b> Das Modell, das nur die
   Positionierung kennt, legt sich im Schnitt bloß 2,0 Punkte von der Grundrate weg fest – das
   Kursmodell dagegen 8,6. Das Verfahren erkennt also von allein, dass in der Positionierung
   nichts steckt, worauf man sich festlegen könnte. Das Messgerät funktioniert. Es zeigt nur
   nichts an.</div>

  <div class="sec"><div class="sechead"><span class="lbl">Was daraus folgt</span><p>Für dieses Vorhaben</p></div>
    <p class="lede" style="max-width:70ch">Kalibriert sein ist nicht dasselbe wie einen Vorteil
     haben. Ein Brief, der jede Woche ehrlich „57 % Chance auf steigend" sagt, ist perfekt
     kalibriert und trotzdem wertlos, weil das jeder nachschlagen kann. Deshalb geht es hier
     nicht um Indexrichtungen, sondern um Ereignisse, bei denen es keine Grundrate zum
     Nachschlagen gibt – und bei denen die öffentliche Konsensschätzung die Messlatte ist.</p>
    <p style="font-size:13px;color:var(--ink-3);margin-top:14px;max-width:70ch">
      Ob sich dort ein Vorsprung zeigt, weiß heute niemand, ich eingeschlossen. Der Unterschied
      zur Indexrichtung ist: Es ist nicht schon nachweislich unmöglich, und es wird in dieser
      Tafel sichtbar, lange bevor jemand dafür Geld ausgibt.</p></div>

  <div class="sec"><div class="sechead"><span class="lbl">Nachrechnen</span><p>Skript und Daten liegen offen</p></div>
    <p style="font-size:13.5px;max-width:70ch">Die Rückrechnung ist ein einzelnes Python-Skript
     ohne Fremdbibliotheken außer pandas und numpy. Kursdaten und CFTC-Berichte stammen aus
     öffentlichen Quellen und sind mit einer Zeile nachladbar. Wer das Ergebnis anzweifelt,
     kann es selbst rechnen – das ist ausdrücklich erwünscht.</p></div>

  <div class="foot">Rückrechnung vom 11. September 2026. Vorwärtsrollend, acht Jahre
   Antrainierfenster, L2-Regularisierung 1,0. Keine Anlageberatung.</div>`};

V["rechtliches"]={r:()=>`<h1>Rechtliches</h1>
  <p class="lede">Diese Seite ist ein persönliches Projekt. Sie bietet nichts an, verkauft
   nichts, bewirbt nichts und sammelt keine Adressen.</p>

  <div class="sec"><div class="sechead"><span class="lbl">Was hier passiert</span><p>Und was nicht</p></div>
    <div class="inp" style="grid-template-columns:200px 1fr"><span class="n">Anmeldung</span>
      <span class="v">keine — es gibt kein Formular</span></div>
    <div class="inp" style="grid-template-columns:200px 1fr"><span class="n">Reichweitenmessung</span>
      <span class="v">keine auf der Seite selbst — kein Zählskript, kein Cookie. Der Anbieter der Auslieferung zählt Aufrufe am Rand mit; diese Auswertung sehe ich ein</span></div>
    <div class="inp" style="grid-template-columns:200px 1fr"><span class="n">Externe Dienste</span>
      <span class="v">keine. Schriften, Skripte und Daten liegen auf demselben Server; beim Aufruf wird nichts an Dritte übermittelt</span></div>
    <div class="inp" style="grid-template-columns:200px 1fr"><span class="n">Server-Protokoll</span>
      <span class="v">beim Anbieter der Auslieferung, technisch bedingt; ich erhalte daraus nur die zusammengefasste Aufrufzahl, keine einzelnen Datensätze</span></div>

/* ==================== Ablauf ==================== */
/* Safari stellt beim Wechsel der Adresse die vorherige Rollposition wieder her -
   auch die seitliche, und zwar NACH unserem scrollTo. Genau das sah aus, als
   waere die Seite beim Reiterwechsel verrutscht. Also selbst uebernehmen. */
if ("scrollRestoration" in history) history.scrollRestoration = "manual";
function route(){
  const h=(location.hash||"#/start").replace(/^#\/?/,"").split("/");
  const key=V[h[0]]?h[0]:"start";
  $("#stage").innerHTML=V[key].r();
  if(V[key].after)V[key].after();
  [...$("#nav").querySelectorAll("button")].forEach(b=>b.setAttribute("aria-current",String(b.dataset.go==="#/"+key)));
  trust();window.scrollTo(0,0);requestAnimationFrame(()=>window.scrollTo(0,0));
}
addEventListener("hashchange",route);
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-go]");
  if(b){e.preventDefault();if(location.hash===b.dataset.go)route();else location.hash=b.dataset.go;}
});

/* ==================== Suche ==================== */
const ITEMS=[
 {t:"Start",k:"Übersicht",go:"#/start"},
 {t:"Register der Aussagen",k:"Aussagen",go:"#/aussagen"},
 {t:"Die vier Regeln",k:"Aussagen",go:"#/aussagen"},
 {t:"Kalibrierungstafel",k:"Nachweis",go:"#/kalibrierung"},
 {t:"Ab wann etwas aussagekräftig ist",k:"Nachweis",go:"#/kalibrierung"},
 {t:"Freitagsbrief",k:"Brief",go:"#/brief"},
 {t:"Rückrechnung: warum keine Indexrichtung",k:"Methode",go:"#/methode"},
 {t:"Positionierung (CFTC)",k:"Methode",go:"#/methode"},
 {t:"Rechtliches",k:"Rechtliches",go:"#/rechtliches"}];
let sel=0,fil=ITEMS;
function pal(){$("#palList").innerHTML=fil.length
  ?fil.map((it,i)=>`<li role="option" aria-selected="${i===sel}" data-i="${i}"><b>${it.t}</b><span>${it.k}</span></li>`).join("")
  :`<li style="color:var(--ink-3);cursor:default">Nichts gefunden.</li>`;}
function openPal(){$("#pal").classList.add("on");$("#palIn").value="";fil=ITEMS;sel=0;pal();$("#palIn").focus();}
function closePal(){$("#pal").classList.remove("on");}
$("#openPal").addEventListener("click",openPal);
$("#palIn").addEventListener("input",e=>{const q=e.target.value.toLowerCase().trim();
  fil=q?ITEMS.filter(i=>(i.t+" "+i.k).toLowerCase().includes(q)):ITEMS;sel=0;pal();});
$("#palList").addEventListener("click",e=>{const li=e.target.closest("li[data-i]");
  if(li){closePal();const g=fil[+li.dataset.i].go;if(location.hash===g)route();else location.hash=g;}});
$("#pal").addEventListener("click",e=>{if(e.target.id==="pal")closePal();});
addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openPal();return;}
  if(!$("#pal").classList.contains("on")){
    if(e.key==="/"&&!/input|textarea/i.test(document.activeElement.tagName)){e.preventDefault();openPal();}return;}
  if(e.key==="Escape")closePal();
  if(e.key==="ArrowDown"){e.preventDefault();sel=Math.min(fil.length-1,sel+1);pal();}
  if(e.key==="ArrowUp"){e.preventDefault();sel=Math.max(0,sel-1);pal();}
  if(e.key==="Enter"){e.preventDefault();if(fil[sel]){closePal();const g=fil[sel].go;if(location.hash===g)route();else location.hash=g;}}
});
/* ==================== Thema ==================== */
function themaSetzen(t){
  if(t==="auto")document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);
  const dunkel=t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);
  $("#thm").textContent=dunkel?"Hell":"Dunkel";
  try{localStorage.setItem("thllq-thema",t);}catch(e){}
  route();
}
(function(){let t="auto";try{t=localStorage.getItem("thllq-thema")||"auto";}catch(e){}
  if(t!=="auto")document.documentElement.setAttribute("data-theme",t);})();
$("#thm").addEventListener("click",()=>{
  const jetztDunkel=document.documentElement.getAttribute("data-theme")==="dark"
    ||(!document.documentElement.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme: dark)").matches);
  themaSetzen(jetztDunkel?"light":"dark");
});
document.addEventListener("click",e=>{if(e.target.id==="druck")window.print();});
route();
(function(){const dunkel=document.documentElement.getAttribute("data-theme")==="dark"
   ||(!document.documentElement.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme: dark)").matches);
  $("#thm").textContent=dunkel?"Hell":"Dunkel";})();
</script>
